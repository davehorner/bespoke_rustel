name: Publish Nightshade viewer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - '.gitmodules'
      - 'nightshade-viewer'
      - 'hearsay'
      - 'music-link/**'
      - 'vendor/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Apply integration source
        run: python3 vendor/setup.py
      - uses: actions/configure-pages@v5
        id: pages
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nightshade-viewer/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nightshade-viewer
          cache-on-failure: true
      - name: Install web build tools
        run: |
          cargo install wasm-bindgen-cli --version 0.2.115 --locked
          cargo install trunk --version 0.21.14 --locked
          npm ci --prefix nightshade-viewer
      - name: Build project website
        run: python3 music-link/build_pages.py --public-url '${{ steps.pages.outputs.base_path }}/'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: music-link/target/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
